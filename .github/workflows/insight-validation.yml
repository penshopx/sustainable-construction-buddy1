name: Frontend and competency insight validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-insight:
    name: Validate competency insight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .migration-backup

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .migration-backup/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run insight contract and publication validation
        run: npm run test:insight:validate

  validate-frontend:
    name: Validate frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .migration-backup

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .migration-backup/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run frontend routing smoke test
        env:
          VITE_SUPABASE_URL: https://ci-playwright.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: npm run test:routing

      - name: Run authenticated frontend smoke tests, including LMS
        env:
          VITE_SUPABASE_URL: https://ci-playwright.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          PLAYWRIGHT_SUPABASE_PROJECT_REF: ci-playwright
        run: npm run test:auth

      - name: Upload authenticated Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-playwright-results
          path: |
            .migration-backup/playwright-report/
            .migration-backup/test-results/
          if-no-files-found: ignore
          retention-days: 7

  validate-active-frontend:
    name: Validate active PUB ASPEKINDO frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared libraries
        run: pnpm run typecheck:libs

      - name: Typecheck active frontend
        run: pnpm --filter @workspace/pub-aspekindo run typecheck

      - name: Build active frontend
        env:
          PORT: "4179"
          BASE_PATH: "/"
          VITE_SUPABASE_URL: https://ci-playwright.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: pnpm --filter @workspace/pub-aspekindo run build

      - name: Install Chromium for routing smoke test
        run: pnpm --filter @workspace/pub-aspekindo exec playwright install --with-deps chromium

      - name: Smoke test public routes and member assessment through results
        run: pnpm --filter @workspace/pub-aspekindo run test:routing

      - name: Install local native media fixture encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test native video network recovery
        run: pnpm --filter @workspace/pub-aspekindo run test:media

      - name: Upload native media evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-media-results
          path: artifacts/pub-aspekindo/test-results/native-media/
          if-no-files-found: ignore